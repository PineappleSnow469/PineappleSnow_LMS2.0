services:
  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 1235789zZ@
      MYSQL_DATABASE: book_manager
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./init-sql:/docker-entrypoint-initdb.d
    networks:
      - app-network

  # 添加 Redis 服务（必须项）
  redis:
    image: redis:6-alpine
    container_name: redis
    restart: always
    ports:
      - "6379:6379" # 可选，调试时可访问
    networks:
      - app-network

  backend:
    build: ./backend
    container_name: backend
    depends_on:
      - mysql
      - redis # 添加依赖
    ports:
      - "8092:8092"
    environment:
      # 使用您原始的数据库配置
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/book_manager?useAffectedRows=true&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: 1235789zZ@
      
      # 添加 Redis 配置
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      
      # 添加上下文路径配置
      SERVER_SERVLET_CONTEXT_PATH: /BookManager
      
      # 确保启用文件上传
      SPRING_SERVLET_MULTIPART_ENABLED: "true"
      SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE: 10MB
      SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE: 100MB
    networks:
      - app-network

  frontend:
    build: ./frontend
    container_name: frontend
    depends_on:
      - backend
    ports:
      - "9528:80"
    networks:
      - app-network

volumes:
  mysql-data:

networks:
  app-network:
