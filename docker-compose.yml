services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest  # 明确使用2022版本
    container_name: sqlserver
    restart: always
    environment:
      ACCEPT_EULA: Y
      SA_PASSWORD: "1235789zZ@"
      MSSQL_PID: Express  # 也可以改为 Developer (功能更全)
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
      - ./init-sql:/docker-entrypoint-initdb.d
    networks:
      - app-network
    healthcheck:  # 添加健康检查
      test: ["CMD-SHELL", "/opt/mssql-tools/bin/sqlcmd -U sa -P $$SA_PASSWORD -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # 添加 Redis 服务（必须项）
  redis:
    image: redis:6-alpine
    container_name: redis
    restart: always
    ports:
      - "6379:6379" # 可选，调试时可访问
    networks:
      - app-network

  backend:
    build: ./backend
    container_name: backend
    depends_on:
      - sqlserver
      - redis # 添加依赖
    ports:
      - "8092:8092"
    environment:
      # 使用您原始的数据库配置
      SPRING_DATASOURCE_URL: jdbc:sqlserver://sqlserver:1433;databaseName=book_manager;encrypt=true;trustServerCertificate=true
      SPRING_DATASOURCE_USERNAME: sa
      SPRING_DATASOURCE_PASSWORD: 1235789zZ@
      
      # 添加 Redis 配置
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      
      # 添加上下文路径配置
      SERVER_SERVLET_CONTEXT_PATH: /BookManager
      
      # 确保启用文件上传
      SPRING_SERVLET_MULTIPART_ENABLED: "true"
      SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE: 10MB
      SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE: 100MB
    networks:
      - app-network

  frontend:
    build: ./frontend
    container_name: frontend
    depends_on:
      - backend
    ports:
      - "9528:80"
    networks:
      - app-network

volumes:
  sqlserver-data:  # 这里明确定义了sqlserver-data卷

networks:
  app-network:
