# 端口号（保持默认，实际端口由Docker映射控制）
server.port=8092
# 上下文根
server.servlet.context-path=${SERVER_SERVLET_CONTEXT_PATH}

# 数据库配置 - 使用环境变量注入
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Redis配置 - 使用环境变量注入
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
# spring.redis.password=${REDIS_PASSWORD:?}

# 文件上传配置
spring.servlet.multipart.enabled=${SPRING_SERVLET_MULTIPART_ENABLED:true}
spring.servlet.multipart.max-file-size=${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE:100MB}

# 启用文件上传（Docker中通常不需要关闭）
spring.servlet.multipart.enabled=true
