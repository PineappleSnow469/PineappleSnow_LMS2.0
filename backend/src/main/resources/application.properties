
server.port=8092
# 上下文根
server.servlet.context-path=${SERVER_SERVLET_CONTEXT_PATH}

# =============== SQL Server 数据库配置 ===============
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:sqlserver://localhost:1433;databaseName=book_manager;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:1235789zZ@}
#spring.sql.init.mode=always

# Hibernate/JPA 配置
spring.jpa.database-platform=org.hibernate.dialect.SQLServer2012Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# =============== Redis 配置 ===============
spring.redis.host=${REDIS_HOST:redis}  # 使用Docker服务名
spring.redis.port=${REDIS_PORT:6379}
# spring.redis.password=${REDIS_PASSWORD:?}

# =============== 文件上传配置 ===============
spring.servlet.multipart.enabled=${SPRING_SERVLET_MULTIPART_ENABLED:true}
spring.servlet.multipart.max-file-size=${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE:100MB}

# =============== 其他优化配置 ===============
# 连接池配置 (HikariCP)
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10